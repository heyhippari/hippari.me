# Vale configuration for Patrika
# Docs: https://docs.vale.sh/topics/.vale.ini

StylesPath = .vale/styles

MinAlertLevel = suggestion

Packages = MDX, write-good, proselint, alex, neighbor, NoAnimalViolence, Readability

Vocab = Patrika

[*.md]
BasedOnStyles = Vale, write-good, proselint, alex, neighbor, NoAnimalViolence, Readability

[*.mdx]
BasedOnStyles = Vale, write-good, proselint, alex, neighbor, NoAnimalViolence, Readability

# Tolerate Obsidian-flavored markup supported by the Sätteri pipeline:
# - [[wikilinks]] and [[wikilinks|aliases]]
# - ==highlights==
# - %%comments%%
TokenIgnores = \[\[[^\]]+\]\], ==[^=]+==, %%[^%]+%%

# - :::aside / :::annotation directive blocks
BlockIgnores = (?s):::.*?\n:::
